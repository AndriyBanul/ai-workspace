name: CI

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/web
      - name: Test frontend
        run: npm test
        working-directory: apps/web
      - name: Check frontend API and routing types
        run: npm run typecheck
        working-directory: apps/web
      - name: Build frontend
        run: npm run build
        working-directory: apps/web

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Clean tests and packaged application
        run: ./gradlew clean test :api:bootJar --no-daemon
        working-directory: apps

  whitespace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check changed lines for whitespace errors
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "origin/$GITHUB_BASE_REF"...HEAD
          else
            git diff --check "$BASE_SHA" HEAD
          fi
