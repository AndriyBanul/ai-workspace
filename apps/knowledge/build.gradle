plugins {
	id 'java-library'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.aiworkspace'
version = '0.0.1-SNAPSHOT'

dependencyManagement {
	imports {
		mavenBom 'org.springframework.boot:spring-boot-dependencies:4.1.1'
		mavenBom 'org.springframework.ai:spring-ai-bom:2.0.1'
	}
}

dependencies {
	implementation project(':shared')
	implementation project(':workspaces')
	compileOnly 'org.springframework.boot:spring-boot'
	compileOnly 'org.springframework:spring-beans'
	compileOnly 'org.springframework:spring-context'
	compileOnly 'org.springframework:spring-web'
	compileOnly 'org.slf4j:slf4j-api'
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'io.micrometer:micrometer-core'
	implementation 'org.springframework.ai:spring-ai-transformers:2.0.1'
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'org.hamcrest:hamcrest'
	testImplementation 'org.springframework:spring-test'
	testImplementation 'org.springframework:spring-web'
	testImplementation 'org.slf4j:slf4j-api'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform { excludeTags 'opensearch' }
}

tasks.register('openSearchIntegrationTest', Test) {
    description = 'Runs real OpenSearch tests against the isolated Docker test cluster.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'opensearch' }
    outputs.upToDateWhen { false }
}
