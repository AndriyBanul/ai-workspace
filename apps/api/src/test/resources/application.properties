spring.datasource.url=jdbc:h2:mem:ai_workspace;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
ai-workspace.security.bcrypt-strength=4
ai-workspace.security.rate-limit.enabled=false
ai-workspace.orchestrator.recovery.enabled=false
ai-workspace.storage.local.root=${java.io.tmpdir}/ai-workspace-test-files
ai-workspace.documents.extraction.max-extracted-characters=256
ai-workspace.documents.extraction.max-extracted-blocks=100
ai-workspace.documents.extraction.max-chunk-sentences=5
spring.ai.model.embedding=none
ai-workspace.knowledge.reranking.enabled=false
ai-workspace.knowledge.query-expansion.enabled=false
