spring.application.name=ai-workspace
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ai_workspace}
spring.datasource.username=${POSTGRES_USER:ai_workspace}
spring.datasource.password=${POSTGRES_PASSWORD:change_me}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
ai-workspace.http.connect-timeout=10s
ai-workspace.http.read-timeout=30s
ai-workspace.http.user-agent=AI-Workspace
ai-workspace.storage.local.root=${AI_WORKSPACE_STORAGE_ROOT:data/files}
ai-workspace.documents.web-page-fetch.max-redirects=5
ai-workspace.documents.web-page-fetch.max-response-bytes=2097152
ai-workspace.documents.extraction.max-extracted-characters=1000000
ai-workspace.documents.extraction.max-extracted-blocks=10000
ai-workspace.documents.extraction.max-pdf-main-memory-bytes=67108864
ai-workspace.documents.extraction.extract-embedded-documents=false
ai-workspace.whisper.base-url=http://localhost:9000
ai-workspace.piper.host=localhost
ai-workspace.piper.port=10200
ai-workspace.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
ai-workspace.gemini.api-key=${GEMINI_API_KEY:}
ai-workspace.gemini.text-model=gemini-2.5-flash
ai-workspace.gemini.image-model=gemini-2.5-flash
ai-workspace.gemini.video-model=gemini-2.5-flash
ai-workspace.veo.base-url=https://generativelanguage.googleapis.com/v1beta
ai-workspace.veo.api-key=${GEMINI_API_KEY:}
ai-workspace.veo.model=veo-3.0-generate-preview
ai-workspace.veo.aspect-ratio=16:9
ai-workspace.flux.base-url=https://api-inference.huggingface.co/models
ai-workspace.flux.api-token=${HUGGING_FACE_API_TOKEN:${HF_TOKEN:}}
ai-workspace.flux.model=black-forest-labs/FLUX.1-dev
ai-workspace.opensearch.base-url=${OPENSEARCH_URL:${OPENSEARCH_BASE_URL:http://localhost:9200}}
