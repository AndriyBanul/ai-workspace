spring.application.name=ai-workspace
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ai_workspace}
spring.datasource.username=${POSTGRES_USER:ai_workspace}
spring.datasource.password=${POSTGRES_PASSWORD:change_me}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
ai-workspace.http.connect-timeout=10s
ai-workspace.http.read-timeout=30s
ai-workspace.http.user-agent=AI-Workspace
ai-workspace.storage.local.root=${AI_WORKSPACE_STORAGE_ROOT:data/files}
ai-workspace.documents.web-page-fetch.max-redirects=5
ai-workspace.documents.web-page-fetch.max-response-bytes=2097152
ai-workspace.documents.extraction.max-extracted-characters=1000000
ai-workspace.documents.extraction.max-extracted-blocks=10000
ai-workspace.documents.extraction.max-pdf-main-memory-bytes=67108864
ai-workspace.documents.extraction.extract-embedded-documents=false
ai-workspace.documents.ocr.enabled=${DOCUMENT_OCR_ENABLED:true}
ai-workspace.documents.ocr.max-pages=${DOCUMENT_OCR_MAX_PAGES:50}
ai-workspace.documents.ocr.dpi=${DOCUMENT_OCR_DPI:150}
ai-workspace.documents.ocr.max-pixels=${DOCUMENT_OCR_MAX_PIXELS:4000000}
ai-workspace.images.ocr.model=${IMAGE_OCR_MODEL:gemini-2.5-flash}
ai-workspace.whisper.base-url=http://localhost:9000
ai-workspace.piper.host=localhost
ai-workspace.piper.port=10200
ai-workspace.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
ai-workspace.gemini.api-key=${GEMINI_API_KEY:}
ai-workspace.gemini.text-model=gemini-2.5-flash
ai-workspace.gemini.image-model=gemini-2.5-flash
ai-workspace.gemini.video-model=gemini-2.5-flash
ai-workspace.knowledge.embedding.enabled=${KNOWLEDGE_EMBEDDINGS_ENABLED:true}
ai-workspace.knowledge.embedding.model=${KNOWLEDGE_EMBEDDING_MODEL:intfloat/multilingual-e5-base}
ai-workspace.knowledge.embedding.dimensions=${KNOWLEDGE_EMBEDDING_DIMENSIONS:768}
ai-workspace.knowledge.embedding.batch-size=${KNOWLEDGE_EMBEDDING_BATCH_SIZE:32}
ai-workspace.knowledge.embedding.candidate-limit=${KNOWLEDGE_SEARCH_CANDIDATE_LIMIT:100}
ai-workspace.knowledge.embedding.rrf-rank-constant=${KNOWLEDGE_SEARCH_RRF_RANK_CONSTANT:30}
ai-workspace.knowledge.search.mode=${KNOWLEDGE_SEARCH_MODE:HYBRID}
ai-workspace.knowledge.query-expansion.enabled=${KNOWLEDGE_QUERY_EXPANSION_ENABLED:true}
ai-workspace.knowledge.query-expansion.query-limit=${KNOWLEDGE_QUERY_EXPANSION_LIMIT:2}
ai-workspace.knowledge.reranking.enabled=${KNOWLEDGE_RERANKING_ENABLED:false}
ai-workspace.knowledge.reranking.model=${KNOWLEDGE_RERANKING_MODEL:cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}
ai-workspace.knowledge.reranking.model-uri=${KNOWLEDGE_RERANKING_MODEL_URI:https://huggingface.co/cross-encoder/mmarco-mMiniLMv2-L12-H384-v1/resolve/9b8bd7b40e70f84c2444fa0f6545773ad74c2fa6/onnx/model.onnx}
ai-workspace.knowledge.reranking.tokenizer-uri=${KNOWLEDGE_RERANKING_TOKENIZER_URI:https://huggingface.co/cross-encoder/mmarco-mMiniLMv2-L12-H384-v1/resolve/9b8bd7b40e70f84c2444fa0f6545773ad74c2fa6/tokenizer.json}
ai-workspace.knowledge.reranking.cache-directory=${KNOWLEDGE_RERANKING_CACHE_DIRECTORY:data/models/spring-ai}
ai-workspace.knowledge.reranking.candidate-limit=${KNOWLEDGE_RERANKING_CANDIDATE_LIMIT:100}
ai-workspace.knowledge.reranking.result-limit=${KNOWLEDGE_RERANKING_RESULT_LIMIT:12}
ai-workspace.knowledge.reranking.batch-size=${KNOWLEDGE_RERANKING_BATCH_SIZE:16}
ai-workspace.knowledge.reranking.max-tokens=${KNOWLEDGE_RERANKING_MAX_TOKENS:512}
spring.ai.model.embedding=${KNOWLEDGE_EMBEDDING_PROVIDER:transformers}
spring.ai.embedding.transformer.onnx.model-uri=${KNOWLEDGE_EMBEDDING_MODEL_URI:https://huggingface.co/intfloat/multilingual-e5-base/resolve/d128750597153bb5987e10b1c3493a34e5a4502a/onnx/model.onnx}
spring.ai.embedding.transformer.tokenizer.uri=${KNOWLEDGE_EMBEDDING_TOKENIZER_URI:https://huggingface.co/intfloat/multilingual-e5-base/resolve/d128750597153bb5987e10b1c3493a34e5a4502a/onnx/tokenizer.json}
spring.ai.embedding.transformer.tokenizer.options[padding]=true
spring.ai.embedding.transformer.tokenizer.options[truncation]=false
spring.ai.embedding.transformer.tokenizer.options[maxLength]=512
spring.ai.embedding.transformer.cache.directory=${KNOWLEDGE_EMBEDDING_CACHE_DIRECTORY:data/models/spring-ai}
ai-workspace.veo.base-url=https://generativelanguage.googleapis.com/v1beta
ai-workspace.veo.api-key=${GEMINI_API_KEY:}
ai-workspace.veo.model=veo-3.0-generate-preview
ai-workspace.veo.aspect-ratio=16:9
ai-workspace.flux.base-url=https://api-inference.huggingface.co/models
ai-workspace.flux.api-token=${HUGGING_FACE_API_TOKEN:${HF_TOKEN:}}
ai-workspace.flux.model=black-forest-labs/FLUX.1-dev
ai-workspace.opensearch.base-url=${OPENSEARCH_URL:${OPENSEARCH_BASE_URL:http://localhost:9200}}

ai-workspace.knowledge.search.heading-weight=${KNOWLEDGE_SEARCH_HEADING_WEIGHT:2}

ai-workspace.documents.extraction.max-chunk-sentences=${DOCUMENT_CHUNK_SENTENCES:5}
